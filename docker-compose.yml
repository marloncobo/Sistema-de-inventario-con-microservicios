version: '3.8'

services:
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: auth_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_admin -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: catalog_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: catalog_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_admin -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: inv_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: inventory_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inv_admin -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  sales-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sales_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sales_db
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_admin -d sales_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8088:8080"
    environment:
      - JWT_SECRET=MiSuperSecretoJWTKey1234567890MiSuperSecretoJWTKey1234567890!
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - INVENTORY_SERVICE_URL=http://inventory-service:8083
      - SALES_SERVICE_URL=http://sales-service:8086
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
      sales-service:
        condition: service_started
    restart: on-failure

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://auth-db:5432/auth_db
      - SPRING_R2DBC_USERNAME=auth_admin
      - SPRING_R2DBC_PASSWORD=password123
      - JWT_SECRET=MiSuperSecretoJWTKey1234567890MiSuperSecretoJWTKey1234567890!
    depends_on:
      auth-db:
        condition: service_healthy
    restart: on-failure

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://catalog-db:5432/catalog_db
      - SPRING_R2DBC_USERNAME=catalog_admin
      - SPRING_R2DBC_PASSWORD=password123
      - INVENTORY_SERVICE_URL=http://inventory-service:8083
    depends_on:
      catalog-db:
        condition: service_healthy
      inventory-service:
        condition: service_started
    restart: on-failure

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://inventory-db:5432/inventory_db
      - SPRING_R2DBC_USERNAME=inv_admin
      - SPRING_R2DBC_PASSWORD=password123
    depends_on:
      inventory-db:
        condition: service_healthy
    restart: on-failure

  sales-service:
    build:
      context: .
      dockerfile: sales-service/Dockerfile
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://sales-db:5432/sales_db
      - SPRING_R2DBC_USERNAME=sales_admin
      - SPRING_R2DBC_PASSWORD=password123
      - INVENTORY_SERVICE_URL=http://inventory-service:8083
      - CATALOG_SERVICE_URL=http://catalog-service:8082
    depends_on:
      sales-db:
        condition: service_healthy
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
    restart: on-failure
