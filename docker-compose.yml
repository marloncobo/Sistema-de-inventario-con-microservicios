version: '3.8'

services:
  users-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: inv_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inv_admin -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: 
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=MiSuperSecretoJWTKey1234567890MiSuperSecretoJWTKey1234567890!
    depends_on:
      users-service:
        condition: service_started
      inventory-service:
        condition: service_started
    restart: on-failure

  users-service:
    build: 
      context: .
      dockerfile: users-service/Dockerfile
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://users-db:5432/users_db
      - SPRING_R2DBC_USERNAME=user_admin
      - SPRING_R2DBC_PASSWORD=password123
      - JWT_SECRET=MiSuperSecretoJWTKey1234567890MiSuperSecretoJWTKey1234567890!
    depends_on:
      users-db:
        condition: service_healthy
    restart: on-failure

  inventory-service:
    build: 
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://inventory-db:5432/inventory_db
      - SPRING_R2DBC_USERNAME=inv_admin
      - SPRING_R2DBC_PASSWORD=password123
    depends_on:
      inventory-db:
        condition: service_healthy
    restart: on-failure
