server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://${USERS_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/auth/**
        - id: users-service
          uri: http://${USERS_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthFilter
            - RoleAuthFilter=ADMIN
        - id: inventory-read-service
          uri: http://${INVENTORY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/categories/**, /api/products/**, /api/reports/**
          filters:
            - JwtAuthFilter
            - RoleAuthFilter=ADMIN,USER
        - id: inventory-write-service
          uri: http://${INVENTORY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/inventory/**
          filters:
            - JwtAuthFilter
            - RoleAuthFilter=ADMIN

jwt:
  secret: ${JWT_SECRET:MiSuperSecretoJWTKey1234567890MiSuperSecretoJWTKey1234567890!}
